name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@1c9f5c8968c4caf8754c98ebeb0889d9e774b5ed # main
    with:
      upstream-repository: VictoriaMetrics/VictoriaMetrics
      upstream-branch: master
      target-branch: main
      strategy: rebase
      go: true
      go-version-file: go.mod
      validation-script: .github/scripts/validate-upstream.sh
