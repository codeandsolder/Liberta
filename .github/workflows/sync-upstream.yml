name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@ecf97ef6708aaba39d6afad83bb82ebcca84723a # main
    with:
      upstream-repository: VictoriaMetrics/VictoriaMetrics
      upstream-branch: master
      target-branch: main
      strategy: rebase
      go: true
      go-version-file: go.mod
      validation-script: .github/scripts/validate-upstream.sh
