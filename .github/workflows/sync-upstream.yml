name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@7df510a2053e220c010c331b5daef81a593a19bb # main
    with:
      upstream-repository: VictoriaMetrics/VictoriaMetrics
      upstream-branch: master
      target-branch: main
      strategy: rebase
      go: true
      go-version-file: go.mod
      validation-script: .github/scripts/validate-upstream.sh
