name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@f0267b6ece698276d68775f04293665f5b7e32c7 # main
    with:
      upstream-repository: VictoriaMetrics/VictoriaMetrics
      upstream-branch: master
      target-branch: main
      workflow-policy: preserve
      go: true
      go-version-file: go.mod
      validation-script: .github/scripts/validate-upstream.sh
